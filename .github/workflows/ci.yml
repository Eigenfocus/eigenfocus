name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare CI files
        run: bin/prepare-ci

      - name: Build the app
        run: docker compose build --build-arg UID=$(id -u) --build-arg GID=$(id -g) web

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: docker compose run --user $(id -u):$(id -g) --rm --remove-orphans web bin/brakeman --no-pager

      - name: Lint code for consistent style
        run: docker compose run --user $(id -u):$(id -g) --rm --remove-orphans web bin/rubocop -f github

      - name: Stop containers
        if: always()
        run: docker compose down

  tests:
    needs: [quality]
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare CI files
        run: bin/prepare-ci

      - name: Build the app
        run: docker compose build --build-arg UID=$(id -u) --build-arg GID=$(id -g) web

      - name: Restore spec runtime log
        uses: actions/cache@v6
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}
          restore-keys: rspec-runtime-

      - name: Setup DB
        run: docker compose run --user $(id -u):$(id -g) --rm --remove-orphans web bin/rails db:prepare

      - name: Setup test DBs
        run: docker compose run --user $(id -u):$(id -g) -e "RAILS_ENV=test" --rm --remove-orphans web bin/rake "parallel:setup[4]"

      - name: Setup Assets
        run: docker compose run --user $(id -u):$(id -g) --rm --remove-orphans web bin/rake assets:precompile

      - name: Check i18n keys
        run: docker compose run --user $(id -u):$(id -g) --rm --remove-orphans web bin/rake i18n:check

      - name: Run Rspec
        run: docker compose run --user $(id -u):$(id -g) -e "RAILS_ENV=test" --rm --remove-orphans web bundle exec parallel_rspec -n 4 spec

      - name: Stop containers
        if: always()
        run: docker compose down
